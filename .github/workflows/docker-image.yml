name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  SHOULD_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

jobs:

  build:

    runs-on: ubuntu-latest
    # Prevents to run on forks
    if: github.repository == 'slotopol/server'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for git describe

    - name: Get current version tag
      id: get_version
      run: |
        VERSION=$(git describe --tags --always)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Current version tag: $VERSION"

    - name: Log in to Docker Hub
      if: ${{ env.SHOULD_PUSH == 'true' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: schwarzlichtbezirk/slotopol
        tags: |
          # 1. On push to main put the tag latest
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          # 2. Processing Git tags (for example, v1.2.3)
          type=semver,pattern={{version}},value=latest,enable=true
          # 3. Unique runner ID for each push
          type=raw,value=${{ github.run_id }},enable=${{ github.event_name == 'push' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: ${{ env.SHOULD_PUSH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILDVERS=${{ steps.get_version.outputs.VERSION }}
